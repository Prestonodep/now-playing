
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Welcome to the Session | MediSession</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300&family=DM+Mono:wght@300;400&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --green: #1DB954;
    --white: #ffffff;
    --off-white: #e8e4df;
    --muted: #a09890;
    --dark: #0a0a0a;
    --card-bg: rgba(255,255,255,0.04);
    --border: rgba(255,255,255,0.08);
  }
  html, body { height: 100%; background: var(--dark); color: var(--white); font-family: 'DM Mono', monospace; overflow-x: hidden; }

  #bg-art {
    position: fixed; inset: 0; z-index: 0;
    background-size: cover; background-position: center;
    filter: blur(80px) brightness(0.25) saturate(1.8);
    transform: scale(1.1);
    transition: background-image 1.5s ease;
    pointer-events: none;
  }

  #player {
    position: relative; z-index: 1;
    min-height: 100vh;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    padding: 2rem;
  }

  .player-inner {
    max-width: 520px; width: 100%;
    display: flex; flex-direction: column; align-items: center;
    gap: 2rem;
  }

  .live-pill {
    display: flex; align-items: center; gap: 6px;
    background: rgba(255,255,255,0.06);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 5px 14px;
    font-size: 0.62rem; letter-spacing: 0.18em; text-transform: uppercase;
    color: var(--muted);
  }
  .live-dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--green);
    animation: pulse-dot 1.8s ease-in-out infinite;
  }
  @keyframes pulse-dot {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.4; transform: scale(0.7); }
  }

  /* ── Playing state ── */
  #playing-state { width: 100%; display: none; flex-direction: column; align-items: center; gap: 2rem; }

  #album-wrap { position: relative; width: min(340px, 80vw); aspect-ratio: 1; }
  #album-img {
    width: 100%; height: 100%; object-fit: cover;
    border-radius: 8px; display: block;
    transition: opacity 0.6s ease;
    box-shadow: 0 30px 80px rgba(0,0,0,0.8);
  }
  #album-img.loading { opacity: 0; }

  #track-info { text-align: center; width: 100%; }
  #track-name {
    font-family: 'Cormorant Garamond', serif;
    font-size: clamp(1.8rem, 5vw, 2.8rem);
    font-weight: 300; letter-spacing: -0.01em; line-height: 1.1;
    color: var(--white); margin-bottom: 0.4em;
  }
  #artist-name { font-size: 0.72rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); margin-bottom: 0.2em; }
  #album-name { font-size: 0.68rem; color: rgba(160,152,144,0.6); font-style: italic; font-family: 'Cormorant Garamond', serif; letter-spacing: 0.04em; }

  #progress-wrap { width: 100%; }
  #progress-bar-bg { width: 100%; height: 2px; background: rgba(255,255,255,0.1); border-radius: 999px; overflow: hidden; margin-bottom: 8px; }
  #progress-bar-fill { height: 100%; background: var(--green); border-radius: 999px; width: 0%; transition: width 1s linear; }
  .time-row { display: flex; justify-content: space-between; font-size: 0.62rem; color: var(--muted); letter-spacing: 0.05em; }

  /* ── Not playing state ── */
  #not-playing { display: flex; flex-direction: column; align-items: center; gap: 2rem; text-align: center; }

  .vinyl { width: min(240px, 60vw); aspect-ratio: 1; position: relative; }
  .vinyl-disc {
    width: 100%; height: 100%; border-radius: 50%;
    background: radial-gradient(circle at 50% 50%,
      #2a2a2a 0%, #1a1a1a 18%, #111 19%,
      #222 20%, #1a1a1a 35%, #111 36%,
      #222 37%, #1a1a1a 52%, #111 53%,
      #222 54%, #1a1a1a 69%, #111 70%,
      #222 71%, #1a1a1a 86%, #111 87%,
      #1a1a1a 100%
    );
    box-shadow: 0 20px 60px rgba(0,0,0,0.8);
  }
  .vinyl-label {
    position: absolute; top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 34%; height: 34%; border-radius: 50%;
    background: #1a1a1a; border: 1px solid rgba(255,255,255,0.06);
    display: flex; align-items: center; justify-content: center;
  }
  .vinyl-hole { width: 14%; height: 14%; border-radius: 50%; background: var(--dark); border: 1px solid rgba(255,255,255,0.1); }
  .vinyl-shine { position: absolute; inset: 0; border-radius: 50%; background: linear-gradient(135deg, rgba(255,255,255,0.04) 0%, transparent 60%); pointer-events: none; }

  .idle-title { font-family: 'Cormorant Garamond', serif; font-size: clamp(1.6rem, 4vw, 2.4rem); font-weight: 300; color: rgba(255,255,255,0.4); font-style: italic; margin-bottom: 0.3rem; }
  .idle-sub { font-size: 0.65rem; color: rgba(160,152,144,0.35); letter-spacing: 0.12em; text-transform: uppercase; margin-bottom: 0.8rem; }
  .sound-bars { display: flex; align-items: flex-end; gap: 3px; height: 16px; justify-content: center; }
  .bar { width: 3px; border-radius: 2px; background: rgba(160,152,144,0.25); }
  .bar:nth-child(1) { height: 5px; } .bar:nth-child(2) { height: 10px; } .bar:nth-child(3) { height: 7px; } .bar:nth-child(4) { height: 14px; } .bar:nth-child(5) { height: 6px; }

  /* ── Error state ── */
  #error-state { display: none; text-align: center; }
  .error-title { font-family: 'Cormorant Garamond', serif; font-size: 1.8rem; font-weight: 300; color: rgba(255,255,255,0.3); font-style: italic; margin-bottom: 0.5rem; }
  .error-sub { font-size: 0.65rem; color: rgba(160,152,144,0.3); letter-spacing: 0.1em; text-transform: uppercase; }

  .footer { position: fixed; bottom: 1.5rem; left: 0; right: 0; text-align: center; font-size: 0.58rem; color: rgba(160,152,144,0.3); letter-spacing: 0.1em; text-transform: uppercase; z-index: 1; }
  .footer a { color: inherit; text-decoration: none; }
  .footer a:hover { color: var(--green); }
</style>
</head>
<body>

<div id="bg-art"></div>

<div id="player">
  <div class="player-inner">

    <div class="live-pill">
      <div class="live-dot"></div>
      <span>live</span>
    </div>

    <!-- Playing -->
    <div id="playing-state">
      <div id="album-wrap">
        <img id="album-img" src="" alt="Album art" class="loading">
      </div>
      <div id="track-info">
        <div id="track-name">—</div>
        <div id="artist-name">—</div>
        <div id="album-name"></div>
      </div>
      <div id="progress-wrap">
        <div id="progress-bar-bg"><div id="progress-bar-fill"></div></div>
        <div class="time-row">
          <span id="time-current">0:00</span>
          <span id="time-total">0:00</span>
        </div>
      </div>
    </div>

    <!-- Not playing -->
    <div id="not-playing">
      <div class="vinyl">
        <div class="vinyl-disc"></div>
        <div class="vinyl-label"><div class="vinyl-hole"></div></div>
        <div class="vinyl-shine"></div>
      </div>
      <div>
        <div class="idle-title">Nothing playing</div>
        <div class="idle-sub">The needle is resting</div>
        <div class="sound-bars">
          <div class="bar"></div><div class="bar"></div><div class="bar"></div>
          <div class="bar"></div><div class="bar"></div>
        </div>
      </div>
    </div>

    <!-- Error -->
    <div id="error-state">
      <div class="error-title">Not configured</div>
      <div class="error-sub">Check API setup</div>
    </div>

  </div>
</div>

<div class="footer"><a href="https://open.spotify.com" target="_blank">Powered by Spotify</a></div>

<script>
let lastTrackId = null;
let progressMs = 0;
let isPlaying = false;
let progressInterval = null;
let totalMs = 0;

function formatTime(ms) {
  const s = Math.floor(ms / 1000);
  return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
}

function showPlaying(data) {
  document.getElementById('not-playing').style.display = 'none';
  document.getElementById('error-state').style.display = 'none';
  document.getElementById('playing-state').style.display = 'flex';

  const item = data.item;
  const trackId = item.id;
  isPlaying = data.is_playing;
  progressMs = data.progress_ms;
  totalMs = item.duration_ms;

  if (trackId !== lastTrackId) {
    lastTrackId = trackId;
    const art = item.album.images[0]?.url || '';
    const imgEl = document.getElementById('album-img');
    if (art) {
      document.getElementById('bg-art').style.backgroundImage = `url('${art}')`;
      imgEl.classList.add('loading');
      imgEl.onload = () => imgEl.classList.remove('loading');
      imgEl.src = art;
    }
    document.getElementById('track-name').textContent = item.name;
    document.getElementById('artist-name').textContent = item.artists.map(a => a.name).join(', ');
    document.getElementById('album-name').textContent = item.album.name;
    document.getElementById('time-total').textContent = formatTime(totalMs);
  }
  updateProgress(progressMs);
}

function showNotPlaying() {
  lastTrackId = null;
  isPlaying = false;
  document.getElementById('playing-state').style.display = 'none';
  document.getElementById('error-state').style.display = 'none';
  document.getElementById('not-playing').style.display = 'flex';
  document.getElementById('bg-art').style.backgroundImage = '';
}

function showError() {
  document.getElementById('playing-state').style.display = 'none';
  document.getElementById('not-playing').style.display = 'none';
  document.getElementById('error-state').style.display = 'block';
}

function updateProgress(ms) {
  if (!totalMs) return;
  const pct = Math.min((ms / totalMs) * 100, 100);
  document.getElementById('progress-bar-fill').style.width = pct + '%';
  document.getElementById('time-current').textContent = formatTime(ms);
}

function tickProgress() {
  if (!isPlaying) return;
  progressMs += 1000;
  updateProgress(progressMs);
}

async function fetchNowPlaying() {
  try {
    const res = await fetch('/api/now-playing');
    if (res.status === 500) { showError(); return; }
    const data = await res.json();
    if (!data.is_playing || !data.item) { showNotPlaying(); return; }
    showPlaying(data);
  } catch (e) {
    showNotPlaying();
  }
}

fetchNowPlaying();
setInterval(fetchNowPlaying, 5000);
progressInterval = setInterval(tickProgress, 1000);
</script>
</body>
</html>
